name: VoltFlow ERP CI
on:
  push:
    branches: [main, complete-erp-build]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: voltflow_test
          POSTGRES_USER: voltflow
          POSTGRES_PASSWORD: voltflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U voltflow -d voltflow_test"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pgsql, pdo_pgsql
          coverage: none
      - run: cp .env.example .env
      - run: composer update --no-interaction --prefer-dist
      - run: php artisan key:generate
      - run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: voltflow_test
          DB_USERNAME: voltflow
          DB_PASSWORD: voltflow
      - run: php artisan test --no-coverage